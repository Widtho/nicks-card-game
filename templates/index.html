<!DOCTYPE html>
<html>
<head>
    <title>Nick's Card Game</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 10px; }
        h1 { text-align: center; color: #0f0; }
        .card { border: 2px solid #333; padding: 12px; margin: 8px; width: 220px; display: inline-block; cursor: pointer; border-radius: 10px; font-size: 14px; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .common { background: #555; } .uncommon { background: #0a5; } .rare { background: #05f; }
        .epic { background: #a0f; } .legendary { background: #fa0; } .unique { background: #f00; color: white; }
        .uber { background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); background-size: 400% 400%; animation: holo 4s linear infinite; color: white; box-shadow: 0 0 20px #fff; }
        @keyframes holo { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }
        .character-sheet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .slot { border: 2px dashed #666; padding: 10px; min-height: 80px; text-align: center; border-radius: 8px; background: #1a1a1a; }
        .filled { border-color: #0f0; background: rgba(0,255,0,0.2); }
        #log-container { display: flex; gap: 15px; margin-top: 15px; height: 420px; }
        #combat-log { flex: 2; border: 1px solid #444; padding: 12px; overflow-y: scroll; background: #0a0a0a; color: #0f0; font-family: monospace; line-height: 1.6; }
        #status-log { flex: 1; border: 1px solid #444; padding: 12px; overflow-y: scroll; background: #1a1a1a; color: #ff0; font-family: monospace; line-height: 1.6; }
        button { margin: 6px; padding: 12px 20px; font-size: 17px; border-radius: 8px; background: #0a5; color: white; border: none; cursor: pointer; }
        button:hover { background: #0f0; }
        button:disabled { background: #555; cursor: not-allowed; }
        .stats-panel { background: #1a1a1a; border: 1px solid #444; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; margin-bottom: 15px; }
        .hp-bar-container { background: #333; height: 20px; border-radius: 10px; margin: 8px 0; overflow: hidden; }
        .hp-bar { height: 100%; background: #0f0; transition: width 0.3s; }
        #victory-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; font-size: 48px; text-align: center; color: #ff0; text-shadow: 0 0 20px #ff0; }
    </style>
</head>
<body>
    <h1>Nick's Card Game</h1>

    <div id="setup">
        <div style="text-align:center; margin-bottom:20px;">
            <h2>Enter Your Name</h2>
            <input id="player-name" placeholder="Your Name" value="Widtho" style="padding:15px; font-size:20px; width:300px;">
            <button onclick="setPlayerName()">Set Name & Start</button>
        </div>
        <button onclick="startGame(1)">Play as Player 1</button>
        <button onclick="startGame(2)">Play as Player 2</button>

        <div style="display:flex; gap:20px; margin-top:20px;">
            <div style="flex:1;">
                <h2 id="name1">Player 1</h2>
                <button onclick="showPool(1)">Browse My 25 Cards</button>
                <button onclick="readyUp(1)">Ready</button>
                <div id="pool1"></div>
                <div class="character-sheet" id="sheet1"></div>
            </div>
            <div style="flex:1;">
                <h2 id="name2">Player 2</h2>
                <button onclick="showPool(2)">Browse My 25 Cards</button>
                <button onclick="readyUp(2)">Ready</button>
                <div id="pool2"></div>
                <div class="character-sheet" id="sheet2"></div>
            </div>
        </div>
    </div>

    <div id="fight-screen" style="display:none;">
        <h2 id="turn-header" style="text-align:center; color:#0f0;"></h2>
        
        <div style="display:flex; justify-content:space-between; margin:15px 0; gap:15px;">
            <div class="stats-panel" id="fight-stats1" style="flex:1;"></div>
            <div class="stats-panel" id="fight-stats2" style="flex:1;"></div>
        </div>

        <div style="display:flex; justify-content:space-between; margin:15px 0;">
            <div style="flex:1; text-align:center;">
                <strong id="player1-name">Player 1</strong><br>
                HP: <span id="hp1">300</span>
                <div class="hp-bar-container"><div id="hpbar1" class="hp-bar" style="width:100%"></div></div>
            </div>
            <div style="flex:1; text-align:center;">
                <strong id="player2-name">Player 2</strong><br>
                HP: <span id="hp2">300</span>
                <div class="hp-bar-container"><div id="hpbar2" class="hp-bar" style="width:100%"></div></div>
            </div>
        </div>

        <div id="log-container">
            <div id="combat-log">Combat details appear here...</div>
            <div id="status-log">Turn status appears here...</div>
        </div>
        
        <div id="actions" style="text-align:center; margin-top:20px;"></div>
    </div>

    <div id="victory-screen">
        <div id="winner-text" style="font-size:60px; margin-bottom:20px;"></div>
        <div id="win-message" style="font-size:28px; margin-bottom:40px;"></div>
        <button onclick="newGame()" style="font-size:24px; padding:15px 30px;">New Game</button>
    </div>

    <script>
        let playerId = null;
        let playerName = "Widtho";
        let currentPool = {1: [], 2: []};
        let equipped = {1: {}, 2: {}};
        let currentTurn = null;
        let attackDeck = {1: [], 2: []};
        let defenseDeck = {1: [], 2: []};
        let hp = {1: 300, 2: 300};
        let energy = {1: 100, 2: 100};
        let combatLog = [];
        let statusLog = [];
        let opponentName = "";

        function setPlayerName() { playerName = document.getElementById('player-name').value.trim() || "Player"; }

        function startGame(p) {
            playerId = p;
            fetch('/api/set_name', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({player:p, name:playerName})})
                .then(() => fetch('/api/start_game', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({player:p})}))
                .then(() => showPool(p));
        }

        function showPool(player) {
            fetch(`/api/pool/${player}`).then(r => r.json()).then(data => {
                currentPool[player] = data.cards || [];
                renderPool(player);
            });
        }

        function renderPool(player) {
            let html = '';
            currentPool[player].forEach(card => {
                let bonusHtml = card.bonus_stats && card.bonus_stats.length ? card.bonus_stats.map(b => `+${b.value} ${b.type}`).join('<br>') : '';
                let specialHtml = card.special_ability ? `<br><strong>Special:</strong> ${card.special_ability}` : '';
                let uberClass = card.is_uber ? 'uber' : card.tier.toLowerCase();
                html += `<div class="card ${uberClass}" onclick="equipCard(${player}, '${card.slot}', ${card.id})">
                    <strong>${card.name}</strong><br>
                    <span style="color:#aaa">${card.slot}</span><br>
                    ${card.base_stat.type}: ${card.base_stat.value}<br>
                    ${bonusHtml}${specialHtml}
                </div>`;
            });
            document.getElementById(`pool${player}`).innerHTML = html;
        }

        function equipCard(player, slot, cardId) {
            const card = currentPool[player].find(c => c.id === cardId);
            if (!card) return;
            if (slot === "Ring") slot = equipped[player]["Ring"] ? "Ring2" : "Ring";
            if (slot.startsWith("Ability")) {
                for (let i = 1; i <= 4; i++) {
                    if (!equipped[player][`Ability ${i}`]) { slot = `Ability ${i}`; break; }
                }
            }
            equipped[player][slot] = card;
            currentPool[player] = currentPool[player].filter(c => c.id !== cardId);
            renderPool(player);
            renderCharacterSheet(player);
        }

        function renderCharacterSheet(player) {
            const slots = ["Head","Chest","Bracers","Gloves","Pants","Boots","Necklace","Ring","Ring2","Main-hand","Off-hand","Familiar","Base Attack","Ability 1","Ability 2","Ability 3","Ability 4"];
            let html = '';
            slots.forEach(s => {
                const card = equipped[player][s];
                html += `<div class="slot ${card ? 'filled' : ''}">${s}<br>${card ? card.name : 'Empty'}</div>`;
            });
            document.getElementById(`sheet${player}`).innerHTML = html;
        }

        function calculateFullStats(player) {
            let stats = { hp: 300, energy: 100, ac: 0, magdef: 0, phys_attack: 0, mag_attack: 0 };
            Object.values(equipped[player] || {}).forEach(card => {
                if (card.base_stat) {
                    const t = card.base_stat.type, v = card.base_stat.value || 0;
                    if (t==="ac") stats.ac += v;
                    if (t==="magdef") stats.magdef += v;
                    if (t==="phys_attack") stats.phys_attack += v;
                    if (t==="mag_attack") stats.mag_attack += v;
                    if (t==="hp") stats.hp += v;
                    if (t==="energy") stats.energy += v;
                }
                if (card.bonus_stats) card.bonus_stats.forEach(b => {
                    const t = b.type, v = b.value || 0;
                    if (t==="ac") stats.ac += v;
                    if (t==="magdef") stats.magdef += v;
                    if (t==="phys_attack") stats.phys_attack += v;
                    if (t==="mag_attack") stats.mag_attack += v;
                    if (t==="hp") stats.hp += v;
                    if (t==="energy") stats.energy += v;
                });
            });
            return stats;
        }

        function updateFightStats() {
            const s1 = calculateFullStats(1);
            const s2 = calculateFullStats(2);
            document.getElementById('fight-stats1').innerHTML = `<strong>Player 1</strong><br>HP: ${s1.hp} | Energy: ${s1.energy}<br>AC: ${s1.ac} | Phys Atk: ${s1.phys_attack}<br>Mag Atk: ${s1.mag_attack} | Mag Def: ${s1.magdef}`;
            document.getElementById('fight-stats2').innerHTML = `<strong>Player 2</strong><br>HP: ${s2.hp} | Energy: ${s2.energy}<br>AC: ${s2.ac} | Phys Atk: ${s2.phys_attack}<br>Mag Atk: ${s2.mag_attack} | Mag Def: ${s2.magdef}`;
        }

        function readyUp(player) {
            fetch(`/api/ready/${player}`, {method:'POST'}).then(r => r.json()).then(data => {
                if (data.fight_active) {
                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('fight-screen').style.display = 'block';
                    opponentName = playerId === 1 ? data.player_names[2] : data.player_names[1];
                    attackDeck[1] = shuffle(createDeck('attack'));
                    attackDeck[2] = shuffle(createDeck('attack'));
                    defenseDeck[1] = shuffle(createDeck('defense'));
                    defenseDeck[2] = shuffle(createDeck('defense'));
                    updateFightStats();
                    syncFightState();
                } else {
                    alert(`Player ${player} is ready!`);
                }
            });
        }

        function createDeck(type) {
            if (type==='attack') return Array(7).fill('Hit').concat(Array(2).fill('Miss'), ['Crit']);
            return Array(7).fill('Hit').concat(Array(2).fill('Ward'), ['Dodge']);
        }
        function shuffle(a) { return a.sort(() => Math.random() - 0.5); }

        function addCombatLog(msg) {
            combatLog.push(msg);
            document.getElementById('combat-log').innerHTML = combatLog.join('<br>');
            document.getElementById('combat-log').scrollTop = document.getElementById('combat-log').scrollHeight;
        }

        function executeAttack(actionName) {
            if (currentTurn !== playerId) return; // strict turn enforcement

            const attacker = playerId;
            const defender = attacker === 1 ? 2 : 1;

            if (actionName !== "Basic Attack" && energy[attacker] < 25) {
                addCombatLog("Not enough energy!");
                return;
            }

            let damage = 20;
            if (actionName === "Basic Attack") {
                const w = equipped[attacker]["Main-hand"] || equipped[attacker]["Off-hand"];
                if (w) damage = w.base_stat.value;
            } else {
                for (let slot in equipped[attacker]) {
                    if (slot.startsWith("Ability") && equipped[attacker][slot] && equipped[attacker][slot].name === actionName) {
                        damage = equipped[attacker][slot].base_stat.value; break;
                    }
                }
            }

            const attackFlip = attackDeck[attacker].pop();
            addCombatLog(`Player ${attacker} uses ${actionName} → ${attackFlip}`);

            if (attackFlip === 'Miss') { addCombatLog("→ Attack missed!"); endTurn(); return; }

            const defFlip = defenseDeck[defender].pop();
            addCombatLog(`Player ${defender} defense → ${defFlip}`);

            let finalDamage = damage;
            if (attackFlip === 'Crit') finalDamage *= 2;
            if (defFlip === 'Ward') finalDamage = Math.floor(finalDamage / 2);
            if (defFlip === 'Dodge') finalDamage = 0;

            fetch('/api/apply_damage', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({defender: defender, damage: finalDamage})
            }).then(() => {
                if (actionName !== "Basic Attack") energy[attacker] -= 25;
                addCombatLog(`→ ${finalDamage} damage! Player ${defender} HP now: ${hp[defender]}`);
                updateHPBars();
                if (hp[defender] <= 0) triggerVictory(attacker);
                else endTurn();
            });
        }

        function updateHPBars() {
            document.getElementById('hp1').textContent = hp[1];
            document.getElementById('hpbar1').style.width = Math.max(0, hp[1]) + '%';
            document.getElementById('hp2').textContent = hp[2];
            document.getElementById('hpbar2').style.width = Math.max(0, hp[2]) + '%';
        }

        function endTurn() {
            fetch('/api/end_turn', {method:'POST'}).then(r => r.json()).then(data => {
                currentTurn = data.current_turn;
                statusLog.push(`Turn passed to ${currentTurn === playerId ? playerName : opponentName}`);
                document.getElementById('status-log').innerHTML = statusLog.join('<br>');
                document.getElementById('status-log').scrollTop = document.getElementById('status-log').scrollHeight;
                updateTurnUI();
            });
        }

        function updateTurnUI() {
            if (!currentTurn) return;
            const isMyTurn = currentTurn === playerId;
            document.getElementById('turn-header').innerHTML = `${playerId === currentTurn ? playerName : opponentName}'s Turn ${isMyTurn ? '(YOUR TURN)' : '(Waiting...)'}`;
            
            let html = '';
            if (isMyTurn) {
                html += `<button onclick="performBasicAttack()">Basic Attack</button>`;
                Object.keys(equipped[playerId]||{}).forEach(slot => {
                    if (slot.startsWith('Ability')) {
                        const card = equipped[playerId][slot];
                        if (card && energy[playerId] >= 25) {
                            html += `<button onclick="performAbility('${card.name.replace(/'/g, "\\'")}')">${card.name}</button>`;
                        }
                    }
                });
            }
            document.getElementById('actions').innerHTML = html;
        }

        function performBasicAttack() { executeAttack("Basic Attack"); }
        function performAbility(name) { executeAttack(name); }

        function triggerVictory(winner) {
            document.getElementById('victory-screen').style.display = 'flex';
            const name = winner === playerId ? playerName : opponentName;
            document.getElementById('winner-text').innerHTML = `${name} WINS!!!`;
            document.getElementById('win-message').innerHTML = "Victory!";
        }

        function syncFightState() {
            fetch('/api/fight_status').then(r => r.json()).then(data => {
                if (data.fight_active) {
                    currentTurn = data.current_turn;
                    hp = data.hp || hp;
                    energy = data.energy || energy;
                    if (data.log && data.log.length > combatLog.length) {
                        const newEntries = data.log.slice(combatLog.length);
                        newEntries.forEach(msg => { if (!msg.includes("Turn passed")) combatLog.push(msg); });
                    }
                    document.getElementById('combat-log').innerHTML = combatLog.join('<br>');
                    document.getElementById('combat-log').scrollTop = document.getElementById('combat-log').scrollHeight;
                    updateTurnUI();
                    updateHPBars();
                    if (hp[1] <= 0 || hp[2] <= 0) triggerVictory(hp[1] > 0 ? 1 : 2);
                }
            });
        }

        function newGame() { fetch('/api/reset', {method:'POST'}).then(() => location.reload()); }

        setInterval(syncFightState, 800);
    </script>
</body>
</html>
